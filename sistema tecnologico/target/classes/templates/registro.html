<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - TechStore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="contenedor-login">

    <div class="card">

        <h1>Crear Cuenta</h1>

        <form th:action="@{/usuarios}" method="post">

            <input
                    type="text"
                    name="nombre"
                    placeholder="Nombre"
                    required>

            <input
                    type="text"
                    name="apellido"
                    placeholder="Apellido"
                    required>

            <input
                    type="email"
                    name="email"
                    placeholder="Correo Electrónico"
                    required>

            <input
                    type="password"
                    name="password"
                    placeholder="Contraseña"
                    required>

            <input
                    type="hidden"
                    name="activo"
                    value="true">

            <button type="submit">
                Registrarse
            </button>

        </form>

        <a th:href="@{/}" class="btn-secundario">
            Volver al Login
        </a>

    </div>

</div>

</body>
</html>
