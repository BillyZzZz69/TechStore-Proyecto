<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="contenedor-login">

    <div class="card">

        <h1>TechStore</h1>

        <p class="subtitulo">
            Sistema de Venta de Productos Tecnológicos
        </p>

        <form th:action="@{/login}" method="post">

            <input
                    type="email"
                    name="email"
                    placeholder="Correo Electrónico"
                    required>

            <input
                    type="password"
                    name="password"
                    placeholder="Contraseña"
                    required>

            <button type="submit">
                Iniciar Sesión
            </button>

        </form>

        <p class="texto">
            ¿No tienes cuenta?
        </p>

        <a href="/registro" class="btn btn-primary">Registrarse</a>

    </div>

</div>

</body>
</html>
